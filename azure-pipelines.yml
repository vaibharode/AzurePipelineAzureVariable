trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

jobs:
  job: DisplayVariablesDev
  displayName: 'Development Job'

  variables:
    - group: 'dev-var'
   
  steps:
    - script: |
        echo "My application is $(appname)"
        echo "My environment is $(environment)"

  job: prod
  displayName: 'Production Job'

  variables:
    - group: 'prod-var'

  steps:
    - script: |
        echo "My application is $(appname)"
        echo "My environment is $(environment)"
